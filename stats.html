<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tôxô - Résultats de l'enquête</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://toxo.soyames.com/stats">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    --green-900:#003527;
    --green-700:#006C49;
    --amber:#F59E0B;
    --ink:#1c2420;
    --muted:#5c6862;
    --paper:#FAF8FF;
    --card:#ffffff;
    --line:#e3e9e5;
    --grid:#eef2ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.5;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}
  header{background:var(--green-900);padding:18px 0}
  header .wrap{padding-bottom:0;display:flex;align-items:center;gap:12px}
  header a{color:#bcd8cb;text-decoration:none;font-weight:600;font-size:.9rem}
  header a:hover{color:#6CF8BB}
  h1{font-size:clamp(1.3rem,3.5vw,1.7rem);font-weight:800;padding:30px 0 4px}
  .sub{color:var(--muted);font-size:.92rem}
  .state{padding:40px 0;color:var(--muted)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:26px 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .tile .label{font-size:.82rem;color:var(--muted);font-weight:600}
  .tile .value{font-size:2.1rem;font-weight:700;margin-top:4px}

  section{margin-top:34px}
  section > h2{font-size:1.15rem;font-weight:800;margin-bottom:4px}
  section > .sub{margin-bottom:14px}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .chart h3{font-size:.95rem;font-weight:700;margin-bottom:14px}
  .row{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:10px;align-items:center;margin-bottom:9px}
  .row .lbl{font-size:.82rem;color:var(--muted);text-align:right;line-height:1.25}
  .bar-cell{display:flex;align-items:center;gap:8px;min-height:18px}
  .bar{
    height:18px;background:var(--green-700);
    border-radius:0 4px 4px 0;
    min-width:2px;
    transition:width .4s ease;
    outline-offset:2px;
  }
  .bar:focus-visible{outline:2px solid var(--amber)}
  .bar-cell .val{font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap}
  .bar-cell .val .pct{color:var(--muted);font-weight:500}

  .timeline{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--grid);padding-top:6px}
  .timeline .col{
    flex:1;background:var(--green-700);border-radius:4px 4px 0 0;min-height:2px;
    outline-offset:2px;
  }
  .timeline .col:focus-visible{outline:2px solid var(--amber)}
  .timeline .col.empty{background:var(--grid)}
  .tlabels{display:flex;gap:6px;margin-top:6px}
  .tlabels span{flex:1;text-align:center;font-size:.62rem;color:var(--muted)}

  details{margin-top:12px}
  summary{font-size:.78rem;color:var(--muted);cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.82rem}
  td,th{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left}
  td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}

  #tooltip{
    position:fixed;display:none;z-index:20;pointer-events:none;
    background:var(--green-900);color:#fff;font-size:.78rem;
    padding:6px 10px;border-radius:8px;max-width:260px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M60 6C38 6 20 24 20 46c0 34.5 40 66 40 66s40-31.5 40-66C100 24 82 6 60 6Z" fill="#6CF8BB"/>
      <circle cx="60" cy="46" r="25" fill="#003527"/>
      <path d="M60 31c-8.3 0-15 6.7-15 15 0 10.6 15 27 15 27s15-16.4 15-27c0-8.3-6.7-15-15-15Z" fill="#F59E0B"/>
    </svg>
    <a href="/">← Tôxô - l'affaire de notre cité</a>
  </div>
</header>

<div class="wrap">
  <h1>Résultats de l'enquête</h1>
  <p class="sub">Réponses anonymes collectées sur <a href="/enquete">l'enquête Tôxô</a>. Actualisé à chaque chargement.</p>
  <div class="state" id="state">Chargement des résultats...</div>
  <div id="dash" style="display:none">
    <div class="tiles" id="tiles"></div>
    <section>
      <h2>Réponses par jour</h2>
      <p class="sub">14 derniers jours</p>
      <div class="chart">
        <div class="timeline" id="timeline"></div>
        <div class="tlabels" id="tlabels"></div>
      </div>
    </section>
    <section id="sec-city"></section>
    <section id="sec-consumer"></section>
    <section id="sec-merchant"></section>
  </div>
</div>
<div id="tooltip" role="status"></div>

<script>
  // Switch to https://api.toxo.soyames.com once the custom domain is added in Render.
  // ?api=http://127.0.0.1:8000 overrides the target for local testing.
  const API_BASE = new URLSearchParams(location.search).get("api") || "https://toxo-api.onrender.com";

  const LABELS = {
    cotonou: "Cotonou", "abomey-calavi": "Abomey-Calavi", "seme-kpodji": "Sèmè-Kpodji",
    "porto-novo": "Porto-Novo", parakou: "Parakou", abomey: "Abomey", bohicon: "Bohicon",
    djougou: "Djougou", natitingou: "Natitingou", kandi: "Kandi", ouidah: "Ouidah",
    lokossa: "Lokossa", "autre-benin": "Autre ville du Bénin", "hors-benin": "Hors du Bénin",
    "tous-les-jours": "Tous les jours", "plusieurs-fois-semaine": "Plusieurs fois par semaine",
    "quelques-fois-semaine": "Quelques fois par semaine", rarement: "Rarement", jamais: "Jamais",
    oui: "Oui", "oui-si-proche": "Oui, si proche", "peut-etre": "Peut-être", non: "Non",
    mtn: "MTN MoMo", moov: "Moov Money", "les-deux": "Les deux", aucun: "Aucun",
    "whatsapp-facebook": "WhatsApp / Facebook", "marche-revendeur": "Marché / revendeur",
    "don-entourage": "Don à l'entourage", "je-garde": "Je garde",
    arnaques: "Arnaques / confiance", desorganise: "Désorganisé", negociation: "Négociation des prix",
    "aucun-probleme": "Aucun problème",
    "oui-avec-points": "Oui, avec des points", "oui-sans-points": "Oui, même sans points",
    "restaurant-maquis": "Restaurant / maquis", "boulangerie-patisserie": "Boulangerie / pâtisserie",
    alimentation: "Alimentation / boutique", hotel: "Hôtel", autre: "Autre",
    "revendus-lendemain": "Revendus le lendemain", donnes: "Donnés", "soldes-fin-journee": "Soldés fin de journée",
    jetes: "Jetés", "oui-si-simple": "Oui, si simple", "non-je-revends": "Non, je revends demain",
    bientot: "Bientôt",
  };

  // Answer order mirrors each question's scale (ordinal where the question is).
  const QUESTIONS = {
    city: { title: "Ville des répondants", order: null },
    buy_frequency: { title: "Fréquence d'achat de repas dehors", order: ["tous-les-jours", "plusieurs-fois-semaine", "rarement", "jamais"] },
    bag_interest: { title: "Achèterait un panier surprise à ~1/3 du prix", order: ["oui", "oui-si-proche", "peut-etre", "non"] },
    momo_usage: { title: "Utilisation du Mobile Money", order: ["mtn", "moov", "les-deux", "aucun"] },
    unused_items_channel: { title: "Devenir des objets inutilisés", order: ["whatsapp-facebook", "marche-revendeur", "don-entourage", "je-garde"] },
    classifieds_pain: { title: "Problème n°1 des ventes entre particuliers", order: ["arnaques", "desorganise", "negociation", "aucun-probleme"] },
    civic_interest: { title: "Signalerait les problèmes du quartier", order: ["oui-avec-points", "oui-sans-points", "non"] },
    business_type: { title: "Type de commerce", order: null },
    surplus_frequency: { title: "Invendus en fin de journée", order: ["tous-les-jours", "quelques-fois-semaine", "rarement", "jamais"] },
    surplus_handling: { title: "Devenir des invendus aujourd'hui", order: ["revendus-lendemain", "donnes", "soldes-fin-journee", "jetes"] },
    bag_supply_interest: { title: "Vendrait ses invendus à ~1/3 du prix", order: ["oui", "oui-si-simple", "non-je-revends", "non"] },
    momo_accepted: { title: "Accepte le Mobile Money", order: ["oui", "bientot", "non"] },
  };
  const CONSUMER_FIELDS = ["buy_frequency", "bag_interest", "momo_usage", "unused_items_channel", "classifieds_pain", "civic_interest"];
  const MERCHANT_FIELDS = ["business_type", "surplus_frequency", "surplus_handling", "bag_supply_interest", "momo_accepted"];

  const tooltip = document.getElementById("tooltip");
  function attachTooltip(el, text) {
    const show = (x, y) => {
      tooltip.textContent = text;
      tooltip.style.display = "block";
      tooltip.style.left = Math.min(x + 12, window.innerWidth - 200) + "px";
      tooltip.style.top = (y + 14) + "px";
    };
    el.addEventListener("mousemove", (e) => show(e.clientX, e.clientY));
    el.addEventListener("mouseleave", () => (tooltip.style.display = "none"));
    el.addEventListener("focus", () => {
      const r = el.getBoundingClientRect();
      show(r.left + r.width / 2, r.bottom);
    });
    el.addEventListener("blur", () => (tooltip.style.display = "none"));
  }

  function barChart(field, counts, denominator) {
    const spec = QUESTIONS[field];
    const entries = spec.order
      ? spec.order.map((key) => [key, counts[key] || 0])
      : Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...entries.map(([, count]) => count));

    const card = document.createElement("div");
    card.className = "chart";
    const title = document.createElement("h3");
    title.textContent = spec.title;
    card.appendChild(title);

    for (const [key, count] of entries) {
      const pct = denominator ? Math.round((count / denominator) * 100) : 0;
      const row = document.createElement("div");
      row.className = "row";
      const lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = LABELS[key] || key;
      const cell = document.createElement("div");
      cell.className = "bar-cell";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = (count / max) * 70 + "%";
      bar.setAttribute("tabindex", "0");
      attachTooltip(bar, `${spec.title} - ${LABELS[key] || key} : ${count} réponse${count > 1 ? "s" : ""} (${pct} %)`);
      const val = document.createElement("span");
      val.className = "val";
      val.innerHTML = `${count} <span class="pct">(${pct} %)</span>`;
      cell.appendChild(bar);
      cell.appendChild(val);
      row.appendChild(lbl);
      row.appendChild(cell);
      card.appendChild(row);
    }

    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Voir le tableau";
    details.appendChild(summary);
    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Réponse</th><th>Total</th></tr>" + entries
      .map(([key, count]) => `<tr><td>${LABELS[key] || key}</td><td>${count}</td></tr>`)
      .join("");
    details.appendChild(table);
    card.appendChild(details);
    return card;
  }

  function renderSection(id, heading, subtitle, fields, stats, denominator) {
    const section = document.getElementById(id);
    section.innerHTML = "";
    const h2 = document.createElement("h2");
    h2.textContent = heading;
    const sub = document.createElement("p");
    sub.className = "sub";
    sub.textContent = subtitle;
    const grid = document.createElement("div");
    grid.className = "charts";
    for (const field of fields) grid.appendChild(barChart(field, stats.fields[field] || {}, denominator));
    section.append(h2, sub, grid);
  }

  function renderTimeline(daily) {
    const byDate = Object.fromEntries(daily.map((d) => [d.date, d.count]));
    const days = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const max = Math.max(1, ...days.map((d) => byDate[d] || 0));
    const timeline = document.getElementById("timeline");
    const tlabels = document.getElementById("tlabels");
    timeline.innerHTML = "";
    tlabels.innerHTML = "";
    for (const day of days) {
      const count = byDate[day] || 0;
      const col = document.createElement("div");
      col.className = "col" + (count ? "" : " empty");
      col.style.height = count ? Math.max(4, (count / max) * 100) + "%" : "2px";
      col.setAttribute("tabindex", "0");
      const human = day.slice(8, 10) + "/" + day.slice(5, 7);
      attachTooltip(col, `${human} : ${count} réponse${count > 1 ? "s" : ""}`);
      timeline.appendChild(col);
      const label = document.createElement("span");
      label.textContent = human.slice(0, 2);
      tlabels.appendChild(label);
    }
  }

  async function load() {
    const state = document.getElementById("state");
    try {
      const response = await fetch(`${API_BASE}/api/v1/survey/stats/`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const stats = await response.json();
      if (!stats.total) {
        state.textContent = "Aucune réponse pour le moment. Partagez l'enquête pour commencer !";
        return;
      }
      state.style.display = "none";
      document.getElementById("dash").style.display = "block";

      const tiles = document.getElementById("tiles");
      tiles.innerHTML = "";
      for (const [label, value] of [
        ["Réponses au total", stats.total],
        ["Consommateurs", stats.consumers],
        ["Commerçants", stats.merchants],
      ]) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `<div class="label">${label}</div><div class="value">${value.toLocaleString("fr-FR")}</div>`;
        tiles.appendChild(tile);
      }

      renderTimeline(stats.daily || []);
      renderSection("sec-city", "Origine", "Tous les répondants", ["city"], stats, stats.total);
      renderSection("sec-consumer", "Consommateurs", `${stats.consumers} répondant${stats.consumers > 1 ? "s" : ""}`, CONSUMER_FIELDS, stats, stats.consumers);
      renderSection("sec-merchant", "Commerçants", `${stats.merchants} répondant${stats.merchants > 1 ? "s" : ""}`, MERCHANT_FIELDS, stats, stats.merchants);
    } catch (error) {
      state.textContent = "Impossible de charger les résultats (" + error.message + "). L'API est peut-être en cours de démarrage - rechargez dans une minute.";
    }
  }
  load();
</script>

</body>
</html>
